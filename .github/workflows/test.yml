name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.8"
            pydantic: "pydantic>=1.10.13,<2"
          - python: "3.10"
            pydantic: "pydantic>=1.10.13,<2"
          - python: "3.10"
            pydantic: "pydantic>=2,<3"
          - python: "3.12"
            pydantic: "pydantic>=2,<3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e . "nonebot2[fastapi]>=2.1.1" "${{ matrix.pydantic }}"
      - name: Test
        run: python -m unittest discover -s tests -v
